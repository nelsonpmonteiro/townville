html/head_include="<meta property=\"og:title\" content=\"Townville - Help the farm\">
<meta property=\"og:description\" content=\"A pixel-art farm adventure that teaches addition, subtraction, multiplication and division through play.\">
<meta property=\"og:image\" content=\"https://townville.vercel.app/index.apple-touch-icon.png\">
<meta property=\"og:url\" content=\"https://townville.vercel.app/\">
<meta property=\"og:type\" content=\"website\">
<meta name=\"twitter:card\" content=\"summary\">
<meta name=\"twitter:title\" content=\"Townville - Help the farm\">
<meta name=\"twitter:description\" content=\"A pixel-art farm adventure that teaches addition, subtraction, multiplication and division through play.\">
<meta name=\"twitter:image\" content=\"https://townville.vercel.app/index.apple-touch-icon.png\">
<script>
// Force-remove any stale Service Worker + Cache Storage from earlier
// deploys. Godot's web export can leave a SW registered that serves an
// old cached index.html/js/wasm forever, surviving normal browser
// \"clear cache\" (which doesn't always touch SW registrations / the
// Cache Storage API). This guarantees every visit gets the live build.
if ('serviceWorker' in navigator) {
	navigator.serviceWorker.getRegistrations().then(function(regs) {
		regs.forEach(function(reg) { reg.unregister(); });
	});
}
if ('caches' in window) {
	caches.keys().then(function(names) {
		names.forEach(function(name) { caches.delete(name); });
	});
}
</script>"
progressive_web_app/enabled=false
progressive_web_app/offline_page=""
progressive_web_app/scope=""
progressive_web_app/origins=""
